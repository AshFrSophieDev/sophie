<div class="patient-container">
    <div class="patient-header">
        <span class="patient-title">🏥 PATIENTE DU CHAT</span>
        <span id="patient-status" class="patient-status-badge">
            Au top !
        </span>
    </div>

    <div class="patient-card">
        <img id="patient-img" src="" alt="État de la patiente">
    </div>

    <div class="stats-container">

        <div class="stat-group">
            <div class="stat-label">
                <span>Santé</span>
                <span id="hp-val">100%</span>
            </div>
            <div class="bar-bg">
                <div id="hp-bar" class="bar-fill hp"></div>
            </div>
        </div>

        <div class="stat-group">
            <div class="stat-label">
                <span>Hydratation</span>
                <span id="hydro-val">50%</span>
            </div>
            <div class="bar-bg">
                <div id="hydro-bar" class="bar-fill hydro"></div>
            </div>
        </div>

        <div class="stat-group">
            <div class="stat-label">
                <span>Température</span>
                <span id="temp-val">37.0°C</span>
            </div>
            <div class="bar-bg">
                <div id="temp-bar" class="bar-fill temp"></div>
            </div>
        </div>

    </div>

    <div id="log-box" class="log-box">
        Le chat doit prendre soin de la patiente !
    </div>
</div>
